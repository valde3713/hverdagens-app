name: Byg iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer afhængigheder
        run: npm install

      - name: Forbered og synkroniser med Capacitor
        run: npm run mobile:sync

      - name: Tjek indhold i ios-mappen
        run: |
          echo "Indhold af ios-roden:"
          ls -la ios

      - name: Byg iOS-projekt (Simulator)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath Build

      - name: Find og pak appen
        working-directory: ios/App
        run: |
          APP_PATH=$(find Build -name "App.app" -type d | head -n 1)
          echo "Fandt app på: $APP_PATH"
          zip -r App.zip "$APP_PATH"

      - name: Upload app som Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: ios/App/App.zip
