name: Byg iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer afhængigheder
        run: npm install

      - name: Kør mobile:prepare (generer web-filer)
        run: npm run mobile:prepare

      - name: Synkroniser med Capacitor
        run: npx cap sync ios

      - name: Find workspace og byg appen automatisk
        run: |
          # Find stien til App.xcworkspace uanset hvor den ligger
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -type d | head -n 1)
          
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "Fejl: Kunne ikke finde App.xcworkspace"
            exit 1
          fi
          
          echo "Fandt workspace på: $WORKSPACE_PATH"
          
          # Gå ind i mappen hvor workspace ligger
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"
          
          # Byg appen
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath Build

      - name: Pak appen som Artifact
        run: |
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -type d | head -n 1)
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"
          
          BUILD_DIR=$(find . -name "Build" -type d | head -n 1)
          APP_PATH=$(find "$BUILD_DIR" -name "App.app" -type d | head -n 1)
          
          echo "Fandt app på: $APP_PATH"
          
          PARENT_DIR=$(dirname "$APP_PATH")
          cd "$PARENT_DIR"
          zip -r App.zip App.app
          
          # Flyt den færdige zip til roden så uploaderen nemt kan finde den
          mv App.zip ../../App.zip

      - name: Upload app som Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: App.zip
