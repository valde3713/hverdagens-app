name: Byg iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer afhængigheder
        run: npm install

      - name: Kør mobile:prepare (generer web-filer)
        run: npm run mobile:prepare

      - name: Tilføj iOS platform (hvis den ikke findes) og synkroniser
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Vis indhold af roden efter sync
        run: ls -la && ls -la ios || echo "Ingen ios-mappe"

      - name: Find og Byg iOS-projekt automatisk
        run: |
          echo "Søger efter App.xcworkspace i hele projektet..."
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -type d | head -n 1)
          
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "Fejl: Kunne ikke finde App.xcworkspace nogen steder!"
            exit 1
          fi
          
          echo "Fandt workspace på: $WORKSPACE_PATH"
          
          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          echo "Skifter til mappen: $WORKSPACE_DIR"
          cd "$WORKSPACE_DIR"
          
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath Build

      - name: Find og pak appen
        run: |
          BUILD_DIR=$(find . -name "Build" -type d | head -n 1)
          APP_PATH=$(find "$BUILD_DIR" -name "App.app" -type d | head -n 1)
          
          echo "Fandt app på: $APP_PATH"
          
          PARENT_DIR=$(dirname "$APP_PATH")
          cd "$PARENT_DIR"
          zip -r App.zip App.app
          
          echo "ZIP_PATH=$PARENT_DIR/App.zip" >> $GITHUB_ENV

      - name: Upload app som Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: '**/App.zip'
